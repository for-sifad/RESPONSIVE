<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple layout</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 120px repeat(3, 1fr);
            grid-template-rows: repeat(3, 145px) 50px 50px;
            gap: 12px;
        }

        .container div {
            background-color: brown;
            color: white;
        }

        .box:nth-child(1) {
            grid-column: 1/ 1;
            grid-row: 1/ -1;
        }

        .box:nth-child(11) {
            grid-column: 2/ -1;
            grid-row: 4;
        }

        .box:nth-child(12) {
            grid-column: 2/ -1;
            grid-row: 5;
        }

        @media screen and (max-width: 576px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            .container .box {
                grid-column: 1 / -1;
                grid-row: auto;
                min-height: 80px;
            }

            .container .box:nth-child(11),
            .container .box:nth-child(12) {
                height: 80px;
                min-height: 80px;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="box ">1</div>
            <div class="box ">2</div>
            <div class="box ">3</div>
            <div class="box ">4</div>
            <div class="box ">5</div>
            <div class="box ">6</div>
            <div class="box ">7</div>
            <div class="box ">8</div>
            <div class="box ">9</div>
            <div class="box ">10</div>
            <div class="box ">11</div>
            <div class="box ">12</div>
        </div>
    </main>
</body>

</html>
